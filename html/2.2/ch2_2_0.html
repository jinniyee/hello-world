<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>컨텐츠 그룹 태그</title>
        <style>
            #HTML{margin: 20px; padding: 20px; border: 1px solid green}
            #CSS{margin: 20px; padding: 20px; border: 1px solid blue}
        </style>
    </head>
    <body>
        <div class="HTML">
            <dl>
                <dt>HTML</dt>
                <dd>정의</dd>
            </dl>
            <div class="HTML_advantage">
                <ol>
                    <li>1번 장점</li>
                    <li>2번 장점</li>
                        <ul>
                            <li>1번 장점에 세부사항_1</li>
                            <li>1번 장점에 세부사항_2</li>
                        </ul>
                    <li>3번 장점</li>
                </ol>
            </div>
        </div>
        <div class="CSS">
            <dl>
                <dt>CSS</dt>
                <dd>정의</dd>
            </dl>
            <div class="CSS_advantage">
                <ol>
                    <li>1번 장점</li>
                        <ul>
                            <li>1번 장점에 세부사항_1</li>
                            <li>1번 장점에 세부사항_2</li>
                        </ul>
                    <li>2번 장점</li>
                    <li>3번 장점</li>
                </ol>

            </div>
        </div>
    </body>
</html>
